<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuestas de la Personería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1ECE1;
    --paper-2:#E9E2D2;
    --ink:#1C2B39;
    --ink-soft:#4A5A68;
    --line:#C9C0AC;
    --seal:#B23A2F;
    --seal-soft:#E8D4CF;
    --sage:#4B6B54;
    --sage-soft:#DCE4D6;
    --amber:#B4791F;
    --amber-soft:#F1E1C3;
    --slate:#6B6558;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:920px;margin:0 auto;padding:3rem 1.5rem 6rem;}

  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:2rem;
    border-bottom:2px solid var(--ink);
    padding-bottom:1.5rem;
    margin-bottom:2.5rem;
  }
  header.top .mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--slate);
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:2.6rem;
    line-height:1.05;
    margin:0.3rem 0 0.4rem;
  }
  header.top p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.95rem;
    max-width:34ch;
  }
  .stats{display:flex;gap:1.75rem;text-align:right;}
  .stat b{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.9rem;
    font-weight:500;
  }
  .stat span{font-size:0.75rem;color:var(--slate);}

  .filters{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:1.5rem;}
  .filters button{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:0.82rem;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:0.4rem 0.85rem;
    border-radius:2px;
    cursor:pointer;
  }
  .filters button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  #list{display:flex;flex-direction:column;gap:1.1rem;}
  .empty{
    padding:3rem 1rem;
    text-align:center;
    color:var(--slate);
    border:1px dashed var(--line);
  }

  .entry{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-left:5px solid var(--slate);
    padding:1.3rem 1.5rem;
  }
  .entry[data-stage="Radicada"]{border-left-color:var(--slate);}
  .entry[data-stage="En estudio"]{border-left-color:var(--amber);}
  .entry[data-stage="Aprobada"]{border-left-color:#5B7FA6;}
  .entry[data-stage="En ejecución"]{border-left-color:var(--seal);}
  .entry[data-stage="Completada"]{border-left-color:var(--sage);}

  .entry-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:1rem;
    cursor:pointer;
  }
  .entry-head .title-block{flex:1;min-width:0;}
  .entry-title{
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    font-weight:500;
    margin:0 0 0.25rem;
  }
  .entry-meta{
    font-size:0.8rem;
    color:var(--slate);
    display:flex;
    gap:0.6rem;
    flex-wrap:wrap;
  }
  .entry-meta .cat{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
  }

  .stage-pill{
    font-size:0.75rem;
    font-weight:500;
    padding:0.3rem 0.7rem;
    border-radius:999px;
    white-space:nowrap;
  }
  .entry[data-stage="Radicada"] .stage-pill{background:#E4E0D5;color:#514D42;}
  .entry[data-stage="En estudio"] .stage-pill{background:var(--amber-soft);color:#7A5314;}
  .entry[data-stage="Aprobada"] .stage-pill{background:#DDE7F1;color:#2F4A66;}
  .entry[data-stage="En ejecución"] .stage-pill{background:var(--seal-soft);color:#7A251E;}
  .entry[data-stage="Completada"] .stage-pill{background:var(--sage-soft);color:#33482D;}

  .progress-row{display:flex;align-items:center;gap:0.8rem;margin-top:0.9rem;}
  .bar{flex:1;height:6px;background:#DDD6C4;position:relative;overflow:hidden;}
  .bar > div{position:absolute;left:0;top:0;bottom:0;background:var(--ink);}
  .entry[data-stage="Completada"] .bar > div{background:var(--sage);}
  .pct{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;min-width:2.6rem;text-align:right;}

  .details{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--line);display:none;}
  .details.open{display:block;}
  .details p{margin:0 0 0.9rem;font-size:0.92rem;color:var(--ink-soft);}

  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:0.9rem 1.5rem;
    margin-bottom:0.2rem;
  }
  .field-grid .f label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    color:var(--slate);
    margin-bottom:0.2rem;
  }
  .field-grid .f div{font-size:0.9rem;}

  .log-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--slate);
    margin:1rem 0 0.5rem;
  }
  .log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.6rem;}
  .log li{font-size:0.88rem;padding-left:0.8rem;border-left:2px solid var(--line);}
  .log li .date{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    color:var(--slate);
    margin-bottom:0.1rem;
  }

  @media (max-width:640px){
    header.top{flex-direction:column;align-items:flex-start;}
    .stats{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="mark">SEGUIMIENTO PÚBLICO · GESTIÓN 2026</div>
      <h1>Propuestas de la Personería</h1>
      <p>Un registro abierto del avance de cada compromiso, con encargados y observaciones al día.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="stat-total">0</b><span>propuestas</span></div>
      <div class="stat"><b id="stat-progreso">0%</b><span>avance promedio</span></div>
      <div class="stat"><b id="stat-completas">0</b><span>completadas</span></div>
    </div>
  </header>

  <div class="filters" id="filters">
    <button data-filter="Todas" class="active">Todas</button>
    <button data-filter="Radicada">Radicada</button>
    <button data-filter="En estudio">En estudio</button>
    <button data-filter="Aprobada">Aprobada</button>
    <button data-filter="En ejecución">En ejecución</button>
    <button data-filter="Completada">Completada</button>
  </div>

  <div id="list"></div>
</div>

<script>
/* ============================================================
   EDITA TUS PROPUESTAS AQUÍ ABAJO. No hay formularios ni base
   de datos: todo lo que ve la gente sale de este arreglo.
   Para actualizar el avance, cambia los valores de "stage" y
   "pct" (y agrega una línea en "log" si quieres dejar constancia).

   Campos de cada propuesta:
   - title       : nombre de la propuesta
   - desc        : descripción breve
   - cat         : categoría (texto libre, ej. "Académico")
   - responsibles: encargados, ej. "Sara Gómez — coordinadora"
   - stage       : una de estas 5 opciones exactas:
                   "Radicada" | "En estudio" | "Aprobada" |
                   "En ejecución" | "Completada"
   - pct         : número de 0 a 100 (el avance real)
   - next        : próximo paso a dar
   - filed       : fecha de radicación, formato "YYYY-MM-DD"
   - dueDate     : fecha estimada de cumplimiento, "YYYY-MM-DD"
                   (déjalo como "" si no hay fecha aún)
   - log         : lista de observaciones, cada una con
                   { date: "YYYY-MM-DD", text: "..." }
                   Agrega una línea nueva cada vez que haya
                   una novedad; no borres las anteriores.

   Para agregar una propuesta nueva, copia un bloque { ... }
   completo dentro de los corchetes [ ] y cambia sus valores.
   Para eliminar una, borra su bloque { ... } completo.
============================================================ */

const proposals = [
  // Ejemplo — bórralo o edítalo con tu propia propuesta real:
  // {
  //   title: "Nombre de la propuesta",
  //   desc: "Qué es y qué problema resuelve.",
  //   cat: "Académico",
  //   responsibles: "Nombre — rol, Nombre — rol",
  //   stage: "En estudio",
  //   pct: 30,
  //   next: "Qué falta para avanzar a la siguiente etapa.",
  //   filed: "2026-09-01",
  //   dueDate: "2026-11-15",
  //   log: [
  //     { date: "2026-09-01", text: "Se presentó la propuesta ante el consejo estudiantil." }
  //   ]
  // },
];

/* ============================================================
   No es necesario tocar nada de aquí para abajo.
============================================================ */

let currentFilter = 'Todas';
let openIndex = null;

function fmtDate(iso){
  if(!iso) return 'Sin fecha';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-CO', {day:'numeric', month:'short', year:'numeric'});
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function computeStats(){
  const total = proposals.length;
  const avg = total ? Math.round(proposals.reduce((s,p)=>s+p.pct,0)/total) : 0;
  const done = proposals.filter(p=>p.stage==='Completada').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-progreso').textContent = avg + '%';
  document.getElementById('stat-completas').textContent = done;
}

function render(){
  computeStats();
  const list = document.getElementById('list');
  const items = proposals
    .map((p,i)=>({...p, _idx:i}))
    .filter(p=> currentFilter==='Todas' || p.stage===currentFilter);

  if(items.length===0){
    list.innerHTML = '<div class="empty">No hay propuestas registradas todavía.</div>';
    return;
  }

  list.innerHTML = items.map(p=>`
    <div class="entry" data-stage="${p.stage}">
      <div class="entry-head" data-toggle="${p._idx}">
        <div class="title-block">
          <h3 class="entry-title">${escapeHtml(p.title)}</h3>
          <div class="entry-meta">
            <span class="cat">${escapeHtml(p.cat)}</span>
            <span>·</span>
            <span>${escapeHtml(p.responsibles || 'Sin encargados asignados')}</span>
          </div>
        </div>
        <span class="stage-pill">${p.stage}</span>
      </div>
      <div class="progress-row">
        <div class="bar"><div style="width:${p.pct}%"></div></div>
        <span class="pct">${p.pct}%</span>
      </div>
      <div class="details ${openIndex===p._idx ? 'open':''}">
        <p>${escapeHtml(p.desc || 'Sin descripción todavía.')}</p>
        <div class="field-grid">
          <div class="f"><label>Radicada</label><div>${fmtDate(p.filed)}</div></div>
          <div class="f"><label>Meta de cumplimiento</label><div>${fmtDate(p.dueDate)}</div></div>
          <div class="f"><label>Próximo paso</label><div>${escapeHtml(p.next || 'Por definir')}</div></div>
        </div>
        <div class="log-title">Bitácora de observaciones</div>
        <ul class="log">
          ${(p.log||[]).slice().reverse().map(l=>`<li><span class="date">${fmtDate(l.date)}</span>${escapeHtml(l.text)}</li>`).join('') || '<li>Sin observaciones aún.</li>'}
        </ul>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.getAttribute('data-toggle'),10);
      openIndex = openIndex === i ? null : i;
      render();
    });
  });
}

document.getElementById('filters').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  currentFilter = btn.getAttribute('data-filter');
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

render();
</script>
</body>
</html>
